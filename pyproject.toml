[project]
name = "gibberish"
version = "0.1.0"
description = "A faux Claude Opus 4.8 / Claude Code CLI experience that streams entirely fake output."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
]

[project.scripts]
gibberish = "app:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "app.py",
    "gibberish.py",
    "anthropic_api.py",
    "timing.py",
    "templates/**",
    "static/**",
]
