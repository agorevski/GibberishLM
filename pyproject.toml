[project]
name = "gibberishlm"
version = "0.1.0"
description = "A local Anthropic-compatible API serving fabricated output for CLI demos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
]

[project.scripts]
gibberishlm = "app:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "app.py",
    "gibberishlm.py",
    "anthropic_api.py",
    "timing.py",
]
